name: CI

on:
  pull_request:
  push:
    # Every branch, so a build of any work in progress is downloadable from
    # the Actions tab without cutting a release.
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 used to sit here. It hardcodes a
      # call to `sdkmanager tools` with no way to skip it, and Google's own
      # package repository has since dropped that legacy package entirely,
      # so the action now fails outright on every run regardless of what
      # this repository builds — it has been red on every push since
      # 2026-09-15, including runs of code that never touched CI. The
      # ubuntu-latest runner already ships a full Android SDK at
      # ANDROID_HOME with the platforms and build-tools this project
      # actually needs, which is all a Gradle build was ever using the
      # action for.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintRelease --no-daemon

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Confirm the generated Gen I tables still match pret/pokered
        run: |
          git clone --depth 1 https://github.com/pret/pokered "$RUNNER_TEMP/pokered"
          python3 tools/generate_gen1_data.py "$RUNNER_TEMP/pokered"
          if ! git diff --quiet -- app/src/main/java/com/logie/gen1storage/pokemon/Gen1SpeciesTable.kt \
                                    app/src/main/java/com/logie/gen1storage/pokemon/Gen1MoveTable.kt; then
            echo "::warning::The committed species/move tables differ from a fresh generation."
            echo "The only expected difference is the source-commit comment; review the diff below."
            git --no-pager diff -- app/src/main/java/com/logie/gen1storage/pokemon/
          fi
          git checkout -- app/src/main/java/com/logie/gen1storage/pokemon/

      # Convenience, not the point of the run. The artifact store has a quota
      # and fills up; a build whose tests and lint both passed has not failed
      # because there was nowhere to put a copy of the APK.
      - name: Upload the debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Gen1Storage-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test and lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
