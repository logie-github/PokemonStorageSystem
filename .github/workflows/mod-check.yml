name: Mod Verification Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Mod Scanner
        uses: 1Jamie/mod-scanner@main
        with:
          path: '.'
          fail-on-flagged: 'true'
          save-previews: 'true'
          upload-artifacts: 'true'
