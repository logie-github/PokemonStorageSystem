name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 2.0.0). Defaults to the versionName in app/build.gradle.kts.'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 1. Determine the release version. A tag push is authoritative; a manual
      #    run may name one; otherwise the versionName in the build file is it.
      - name: Determine the release version
        id: version
        run: |
          set -euo pipefail
          gradle_version="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="$gradle_version"
          fi
          if [ "$version" != "$gradle_version" ]; then
            echo "::error::Release version $version does not match versionName $gradle_version in app/build.gradle.kts."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "apk=Gen1Storage-v$version.apk" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintRelease --no-daemon

      # 2/3. Build and sign. The keystore never touches the repository: it is
      #      an encrypted secret, decoded into the runner's temp directory and
      #      passed to Gradle through the environment.
      - name: Decode the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the release signing secrets before publishing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 4/5. Verify the APK is real and signed, then checksum it.
      - name: Verify the APK and compute its SHA-256
        id: artifact
        run: |
          set -euo pipefail
          built="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$built" ]; then
            echo "::error::No signed APK at $built. The signing secrets were probably not applied."
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs "$built"
          mkdir -p release
          cp "$built" "release/${{ steps.version.outputs.apk }}"
          cd release
          sha256sum "${{ steps.version.outputs.apk }}" > "${{ steps.version.outputs.apk }}.sha256"
          echo "sha256=$(cut -d' ' -f1 < "${{ steps.version.outputs.apk }}.sha256")" >> "$GITHUB_OUTPUT"
          cat "${{ steps.version.outputs.apk }}.sha256"

      - name: Upload the release APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: release/*
          if-no-files-found: error

      # 6. Create the tag when the run was started by hand.
      - name: Create the release tag
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; the release will be updated in place."
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      # 7. Release notes: the commits since the previous tag, plus the facts a
      #    person needs to trust the file they are about to install.
      - name: Write the release notes
        id: notes
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          previous="$(git tag --sort=-version:refname | grep -v "^$tag$" | head -1 || true)"
          {
            echo "### Install"
            echo
            echo "\`${{ steps.version.outputs.apk }}\` — sideload it on Android 8.0 (API 26) or newer."
            echo
            echo "Verify the download before installing:"
            echo
            echo '```'
            echo "sha256sum -c ${{ steps.version.outputs.apk }}.sha256"
            echo '```'
            echo
            echo "SHA-256: \`${{ steps.artifact.outputs.sha256 }}\`"
            echo
            echo "### Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..HEAD"
              echo
              echo "[Full changelog](${{ github.server_url }}/${{ github.repository }}/compare/$previous...$tag)"
            else
              echo "First release."
            fi
          } > release-notes.md
          cat release-notes.md

      # 8/9. Publish, with the APK and its checksum attached.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pokémon Storage ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease == true }}
          files: |
            release/${{ steps.version.outputs.apk }}
            release/${{ steps.version.outputs.apk }}.sha256
          fail_on_unmatched_files: true
